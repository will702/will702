name: Profile link health

on:
  pull_request:
    paths:
      - README.md
      - llms.txt
      - .github/workflows/profile-health.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check public links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-mail
            --accept 200..=299,403,429
            README.md llms.txt
